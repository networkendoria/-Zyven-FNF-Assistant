name: Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Verify debug APK signature and package
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          test -n "$AAPT"
          "$APKSIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" | grep -E "^(package: name='com.zyven.fnfassistant'|sdkVersion:'26'|targetSdkVersion:'35')"
          sha256sum "$APK"
          stat -c 'APK size: %s bytes' "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Zyven-FNF-Assistant-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # A persistent release signature is required for reliable app updates.
      - name: Prepare release signing key
        if: env.HAS_RELEASE_KEYSTORE != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/zyven-release.jks"
          test -s "$RUNNER_TEMP/zyven-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/zyven-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: env.HAS_RELEASE_KEYSTORE != ''
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_STORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          gradle assembleRelease

      - name: Upload signed release APK
        if: env.HAS_RELEASE_KEYSTORE != ''
        uses: actions/upload-artifact@v4
        with:
          name: Zyven-FNF-Assistant-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
